[project]
name = "kagglepipe"
version = "0.2.0"
description = "A reproducible command-line workflow for Kaggle datasets, kernels, artifacts, and submissions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kagglepipe contributors" }]
keywords = ["kaggle", "cli", "workflow", "gpu", "notebook", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "jinja2>=3.1",
    "kaggle>=1.6",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/AdityaProCoder/kagglepipe"
Documentation = "https://github.com/AdityaProCoder/kagglepipe#readme"
Issues = "https://github.com/AdityaProCoder/kagglepipe/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.2",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
kagglepipe = "kagglepipe.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kagglepipe*"]

[tool.setuptools.package-data]
kagglepipe = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["src"]
markers = [
    "integration: end-to-end tests that hit the real Kaggle API (set KAGGLEPIPE_RUN_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
